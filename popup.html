<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠팡 리뷰 크롤러</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛒 쿠팡 리뷰 크롤러</h1>
      <p class="subtitle">현재 쿠팡 상품 탭에서 리뷰를 수집합니다</p>
    </div>

    <div class="bridge-banner">
      <p>URL 입력 · WordPress 발행은 <strong>웹 대시보드</strong>에서 하세요.</p>
      <button type="button" id="openDashboardBtn" class="btn btn-wp btn-sm">웹 대시보드 열기</button>
      <label class="bridge-field">
        서버 주소
        <input type="url" id="bridgeApiUrl" placeholder="https://review.choineiu.com" />
      </label>
      <label class="bridge-field">
        Basic Auth 사용자
        <input type="text" id="bridgeBasicUser" placeholder="admin" autocomplete="username" />
      </label>
      <label class="bridge-field">
        Basic Auth 비밀번호
        <input type="password" id="bridgeBasicPass" placeholder="••••••••" autocomplete="current-password" />
      </label>
      <label class="bridge-toggle">
        <input type="checkbox" id="bridgeEnabled" checked />
        웹 대시보드 연동 (백그라운드 작업 수신)
      </label>
      <button type="button" id="saveBridgeBtn" class="btn btn-secondary btn-sm">연동 설정 저장</button>
      <p id="bridgeConnStatus" class="bridge-conn">서버 연결 확인 중…</p>
    </div>

    <div class="status-section">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">대기 중</span>
      </div>
      <div class="progress-info" id="progressInfo" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">페이지 1 크롤링 중...</div>
      </div>
    </div>

    <div class="controls-section">
      <button id="startBtn" class="btn btn-primary">
        <span class="btn-icon">▶️</span>
        현재 페이지 크롤링
      </button>
      <button id="stopBtn" class="btn btn-secondary" disabled>
        <span class="btn-icon">⏹️</span>
        중지
      </button>
    </div>

    <div class="settings-section">
      <div class="setting-item">
        <label for="maxPages">최대 페이지 수:</label>
        <input type="number" id="maxPages" value="5" min="1" max="50">
      </div>
    </div>

    <div class="results-section" id="resultsSection" style="display: none;">
      <div class="results-header">
        <h3>크롤링 결과</h3>
        <span class="results-count" id="resultsCount">0개 리뷰</span>
      </div>
      <div class="results-actions">
        <button id="exportBtn" class="btn btn-success">
          <span class="btn-icon">📊</span>
          CSV 다운로드
        </button>
        <button id="viewBtn" class="btn btn-info">
          <span class="btn-icon">👁️</span>
          리뷰 보기
        </button>
      </div>
    </div>

    <div class="info-section">
      <div class="info-item">
        <span class="info-label">현재 페이지:</span>
        <span class="info-value" id="currentPage">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">수집된 리뷰:</span>
        <span class="info-value" id="collectedReviews">0개</span>
      </div>
    </div>

    <div class="footer">
      <p class="disclaimer">
        ⚠️ 교육·개인 용도로만 사용하세요.<br>
        쿠팡 이용약관을 준수해 주세요.
      </p>
    </div>
  </div>

  <div id="reviewModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>수집된 리뷰 미리보기</h3>
        <span class="close" id="closeModal">&times;</span>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
